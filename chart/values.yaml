app_name: vendrop
replicas: 1
API_PORT: '8080'

# Published image. Point registry/repository at your own mirror if your
# cluster cannot pull from Docker Hub.
image:
  registry: docker.io
  repository: nautilus444/vendrop
  tag: v1.0.4
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
    ephemeral-storage: 5Gi
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
affinity: {}

# Which per-env block below applies, and the wildcard domain the Route uses:
# the Route host becomes <app_name>.<env>_hostname (dev/uat/preview use
# dev_hostname). Set these to your cluster's apps domain.
env: dev
dev_hostname: apps.example.com
prod_hostname: apps.example.com
drc_hostname: apps.example.com

# PVC backs /data — holds projects.json + audit.jsonl. Single-replica + Recreate
# strategy: file-backed state can't tolerate two pods writing the same JSON.
persistence:
  enabled: true
  size: 1Gi
  # RWX so the volume never has to be detached from a node to move the pod.
  # vendrop runs a single replica regardless - this is about rescheduling,
  # not scale. Drop to ReadWriteOnce only if the chosen class has no RWX mode.
  accessMode: ReadWriteMany
  # Required - the render fails if this is empty, on purpose. See the comment
  # in templates/pvc.yaml.
  #
  # e.g. ocs-storagecluster-cephfs on OpenShift Data Foundation
  storageClassName: ""

# Per-env overrides. `config` is merged into the ConfigMap (envFrom).
# The Secret named `{{ .Values.app_name }}-secrets` (NEXUS_USER, NEXUS_PASS,
# ADMIN_USER, ADMIN_PASS, SECRET_KEY) is created manually out-of-band via
# `oc create secret generic` — not managed by this chart.
preview:
  replicas: 0
  config: []

dev:
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
      ephemeral-storage: 5Gi
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 1Gi
  config:
    NEXUS_RAW_BASE: ""          # required, e.g. https://nexus.example.com
    NEXUS_VERIFY_TLS: "true"    # "false" only for a self-signed Nexus
    DATA_DIR: "/data"
    DEFAULT_MAX_MB: "500"

uat:
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
      ephemeral-storage: 5Gi
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 1Gi
  config:
    NEXUS_RAW_BASE: ""          # required, e.g. https://nexus.example.com
    NEXUS_VERIFY_TLS: "true"    # "false" only for a self-signed Nexus
    DATA_DIR: "/data"
    DEFAULT_MAX_MB: "500"

prod:
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
      ephemeral-storage: 5Gi
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 1Gi
  config:
    NEXUS_RAW_BASE: ""          # required, e.g. https://nexus.example.com
    NEXUS_VERIFY_TLS: "true"    # "false" only for a self-signed Nexus
    DATA_DIR: "/data"
    DEFAULT_MAX_MB: "500"

drc:
  replicas: 0
  config: []
