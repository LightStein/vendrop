apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.app_name }}
  labels:
    app: {{ .Values.app_name }}
spec:
  host: {{ template "ingress.hostName" . }}
  to:
    kind: Service
    name: {{ .Values.app_name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
