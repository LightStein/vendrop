---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app_name }}
  labels:
    app: {{ .Values.app_name }}
    app.kubernetes.io/component: {{ .Values.app_name }}
    app.kubernetes.io/instance: {{ .Values.app_name }}
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: {{ .Values.API_PORT }}
  selector:
    {{- include "helm.selectorLabels" . | nindent 4 }}
  sessionAffinity: None
  type: ClusterIP
