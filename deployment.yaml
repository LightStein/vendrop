---
# Vendrop v1.0.4 - Kubernetes/OpenShift Deployment
#
# Browser upload tool for vendor archives, constrained to admin-configured
# Nexus raw repo paths. Admin manages projects + per-project vendor tokens;
# vendors land on /u/<project>?t=<token> and drag archives in.
#
# Standalone manifest, for clusters without Helm or GitOps. The Helm chart in
# chart/ is the fuller option. Before applying, fill in every value marked
# CHANGE-ME (Nexus URL, Secret values, storage class), then:
#
#   kubectl apply -f deployment.yaml
#
# The Route at the bottom is OpenShift-only; on plain Kubernetes delete it and
# put an Ingress in front of the Service instead.
---
apiVersion: v1
kind: Namespace
metadata:
  name: vendrop
---
apiVersion: v1
kind: Secret
metadata:
  name: vendrop-secrets
  namespace: vendrop
type: Opaque
stringData:
  NEXUS_USER: admin
  NEXUS_PASS: ""              # CHANGE-ME: Nexus account that may write the raw repos
  ADMIN_USER: admin
  ADMIN_PASS: ""              # CHANGE-ME: admin UI password
  SECRET_KEY: ""              # CHANGE-ME: openssl rand -hex 32. Unset = everyone logged out on restart
---
# PVC so project config + audit log survive pod restarts.
#
# Set storageClassName explicitly. Left out, the claim binds to the cluster
# default, which is often an in-tree cloud provisioner that has to detach the
# volume before the pod can move to another node - and a detach that hangs
# pins the pod indefinitely. An RWX class (CephFS, NFS, ...) needs no detach.
# vendrop still runs one replica; RWX is about rescheduling, not scale.
#
# storageClassName and accessModes cannot be changed on an existing claim, so
# choose before first apply.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vendrop-data
  namespace: vendrop
  annotations:
    # Keep the volume if this manifest is ever pruned or reapplied. The vendor
    # upload tokens live in projects.json on here - losing it invalidates every
    # link that has been handed out.
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: CHANGE-ME     # e.g. ocs-storagecluster-cephfs, nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendrop
  namespace: vendrop
  labels:
    app: vendrop
spec:
  replicas: 1            # single replica: projects and audit log are files
  # Recreate, not RollingUpdate. Overlapping old and new pods would be two
  # writers on the same projects.json and audit.jsonl.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vendrop
  template:
    metadata:
      labels:
        app: vendrop
    spec:
      containers:
        - name: app
          image: docker.io/nautilus444/vendrop:v1.0.4
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NEXUS_RAW_BASE
              value: "CHANGE-ME"    # e.g. https://nexus.example.com
            - name: NEXUS_VERIFY_TLS
              value: "true"         # "false" only for a self-signed Nexus
            - name: DATA_DIR
              value: "/data"
            - name: DEFAULT_MAX_MB
              value: "500"
            - name: NEXUS_USER
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: NEXUS_USER }
            - name: NEXUS_PASS
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: NEXUS_PASS }
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: ADMIN_USER }
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: ADMIN_PASS }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: SECRET_KEY }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "512Mi"
              cpu: "1000m"
              ephemeral-storage: "5Gi"
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vendrop-data
---
apiVersion: v1
kind: Service
metadata:
  name: vendrop
  namespace: vendrop
  labels:
    app: vendrop
spec:
  selector:
    app: vendrop
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
# OpenShift Route - edge-terminated TLS via the cluster's wildcard cert.
# Auth is handled inside the app (admin session for /admin, vendor token in URL for /u).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vendrop
  namespace: vendrop
spec:
  to:
    kind: Service
    name: vendrop
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
