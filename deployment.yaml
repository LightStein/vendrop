---
# Vendrop v1.0.4 - Kubernetes/OpenShift Deployment
#
# Browser upload tool for vendor archives, constrained to admin-configured
# Nexus raw repo paths. Admin manages projects + per-project vendor tokens;
# vendors land on /u/<project>?t=<token> and drag archives in.
#
# Apply: oc apply -f deployment.yaml -n devops-tools
---
apiVersion: v1
kind: Namespace
metadata:
  name: devops-tools
  labels:
    team: devops
---
apiVersion: v1
kind: Secret
metadata:
  name: vendrop-secrets
  namespace: devops-tools
type: Opaque
stringData:
  NEXUS_USER: admin
  NEXUS_PASS: ""              # UPDATE before apply
  ADMIN_USER: admin
  ADMIN_PASS: ""              # UPDATE — admin login password
  SECRET_KEY: ""              # generate with: openssl rand -hex 32
---
# PVC so project config + audit log survive pod restarts.
#
# storageClassName is set explicitly and must stay that way. Without it the
# claim binds to the cluster default, which on the ANB clusters is `thin` -
# the in-tree vSphere provisioner. That is the same class behind the nine-day
# stuck detach in July 2026, where vCenter would not release the volume and
# the pod could not be rescheduled to another node.
#
# CephFS with RWX needs no detach at all, so a node going away costs nothing.
# vendrop still runs a single replica; RWX is about rescheduling, not scale.
#
# NOTE: storageClassName and accessModes are immutable on an existing PVC.
# An already-deployed vendrop cannot be patched onto the new class - the data
# has to be copied to a new claim. See MIGRATION-cephfs.md in this directory
# before applying this file to a namespace where vendrop already runs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vendrop-data-cephfs
  namespace: devops-tools
  annotations:
    # Keep the volume if this manifest is ever pruned or reapplied. The vendor
    # upload tokens live in projects.json on here - losing it invalidates every
    # link that has been handed out.
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ocs-storagecluster-cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendrop
  namespace: devops-tools
  labels:
    app: vendrop
    team: devops
spec:
  # Recreate, not RollingUpdate. vendrop keeps projects.json and audit.jsonl
  # on the volume; overlapping old and new pods would have two writers on the
  # same files.
  strategy:
    type: Recreate
  replicas: 1            # single-replica: file-backed projects + audit log
  strategy:
    type: Recreate       # avoid two replicas racing on the JSON files
  selector:
    matchLabels:
      app: vendrop
  template:
    metadata:
      labels:
        app: vendrop
    spec:
      containers:
        - name: app
          image: registry.nexus.anb.net/devops/vendrop:v1.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NEXUS_RAW_BASE
              value: "https://nxrm-operator-certified-nexus.apps.ocpdev.anb.net"
            - name: NEXUS_VERIFY_TLS
              value: "false"        # internal CA, mirror image-copier behaviour
            - name: DATA_DIR
              value: "/data"
            - name: DEFAULT_MAX_MB
              value: "500"
            - name: NEXUS_USER
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: NEXUS_USER }
            - name: NEXUS_PASS
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: NEXUS_PASS }
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: ADMIN_USER }
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: ADMIN_PASS }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: vendrop-secrets, key: SECRET_KEY }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "512Mi"
              cpu: "1000m"
              ephemeral-storage: "5Gi"
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vendrop-data-cephfs
---
apiVersion: v1
kind: Service
metadata:
  name: vendrop
  namespace: devops-tools
  labels:
    app: vendrop
spec:
  selector:
    app: vendrop
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
# Public Route — edge-terminated TLS via the cluster's wildcard cert.
# Auth is handled inside the app (admin session for /admin, vendor token in URL for /u).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vendrop
  namespace: devops-tools
spec:
  to:
    kind: Service
    name: vendrop
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
